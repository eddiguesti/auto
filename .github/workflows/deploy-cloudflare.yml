name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm run test:all

      - name: Build assets and Worker
        run: npm run build:cloudflare

      - name: Validate account-specific configuration
        run: npm run cloudflare:check

      - name: Apply forward-only database migrations
        run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config services/cloudflare/wrangler.jsonc
