name: PostgreSQL Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  backup:
    if: vars.CLOUDFLARE_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client awscli

      - name: Create, verify, and upload backup
        run: bash tools/scripts/backup-db.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
